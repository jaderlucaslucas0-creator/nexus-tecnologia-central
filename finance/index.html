<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nexus Finance</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#08111f;color:#eef4ff}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 15px;background:#2563eb;color:#fff;font-weight:700}.hidden{display:none!important}.wrap{max-width:1180px;margin:auto;padding:24px}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.card{background:#101c2d;border:1px solid #20314a;border-radius:18px;padding:28px;box-shadow:0 20px 60px #0006}.auth{width:min(420px,100%)}h1{margin:0 0 6px}.muted{color:#91a1b7}.field{display:grid;gap:7px;margin:13px 0}.field input,.field select{background:#0b1627;color:#fff;border:1px solid #2a3c55;border-radius:10px;padding:12px;outline:none}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:22px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.metric{background:#101c2d;border:1px solid #20314a;border-radius:15px;padding:18px}.metric b{display:block;font-size:25px;margin-top:8px}.green{color:#43d18a}.red{color:#ff6b7d}.yellow{color:#ffd166}.blue{color:#66a3ff}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.panel{background:#101c2d;border:1px solid #20314a;border-radius:15px;padding:18px;margin-top:16px}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px 8px;border-bottom:1px solid #20314a}.modal{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px}.modal .card{width:min(560px,100%)}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.danger{background:#a9233b}.secondary{background:#25354b}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.table{font-size:13px}.wrap{padding:14px}}@media(max-width:500px){.grid{grid-template-columns:1fr}}
</style></head><body>
<div id="auth" class="login"><div class="card auth">
<h1>NEXUS FINANCE</h1><p class="muted">Controle de entradas, gastos, serviços e parcelamentos.</p>
<div id="loginBox"><div class="field"><label>Usuário</label><input id="lu"></div><div class="field"><label>Senha</label><input id="lp" type="password"></div><button onclick="login()">Entrar</button><button class="secondary" style="margin-left:8px" onclick="showRegister()">Criar conta</button></div>
<div id="regBox" class="hidden"><div class="field"><label>Usuário</label><input id="ru"></div><div class="field"><label>Senha</label><input id="rp" type="password"></div><div class="field"><label>Confirmar senha</label><input id="rc" type="password"></div><button onclick="register()">Criar conta</button><button class="secondary" style="margin-left:8px" onclick="showLogin()">Voltar</button></div>
<p id="msg" class="muted"></p></div></div>
<div id="app" class="hidden"><div class="wrap">
<div class="top"><div><h1>NEXUS FINANCE</h1><span class="muted">Olá, <span id="user"></span></span></div><button class="secondary" onclick="logout()">Sair</button></div>
<div class="grid"><div class="metric">Saldo<b id="saldo">R$ 0,00</b></div><div class="metric">Entradas<b class="green" id="ent">R$ 0,00</b></div><div class="metric">Saídas<b class="red" id="sai">R$ 0,00</b></div><div class="metric">A receber<b class="yellow" id="pend">R$ 0,00</b></div></div>
<div class="actions"><button onclick="openModal()">+ Nova movimentação</button><button class="secondary" onclick="exportCSV()">Exportar CSV</button></div>
<div class="panel"><h2>Movimentações</h2><table class="table"><thead><tr><th>Data</th><th>Tipo</th><th>Categoria</th><th>Descrição</th><th>Parcelas</th><th>Valor</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div>
</div></div>
<div id="modal" class="modal hidden"><div class="card"><h2>Nova movimentação</h2>
<div class="row"><div class="field"><label>Tipo</label><select id="type"><option value="entrada">Entrada</option><option value="saida">Saída</option></select></div><div class="field"><label>Categoria</label><select id="cat"><option>Serviço fixo</option><option>Manutenção de computador</option><option>Manutenção de portão</option><option>Outros serviços</option><option>Comida</option><option>Contas</option><option>Assinaturas</option><option>Jogos</option><option>Transporte</option><option>Materiais</option><option>Outros</option></select></div></div>
<div class="row"><div class="field"><label>Descrição</label><input id="desc"></div><div class="field"><label>Cliente</label><input id="client"></div></div>
<div class="row"><div class="field"><label>Valor total</label><input id="amount" type="number" step="0.01" min="0"></div><div class="field"><label>Número de parcelas</label><input id="parts" type="number" min="1" value="1"></div></div>
<div class="row"><div class="field"><label>Primeiro vencimento</label><input id="date" type="date"></div><div class="field"><label>Status</label><select id="status"><option value="recebido">Recebido/Pago</option><option value="pendente">Pendente</option></select></div></div>
<button onclick="saveMove()">Salvar</button><button class="secondary" style="margin-left:8px" onclick="closeModal()">Cancelar</button></div></div>
<script>
const K='nexus_finance_v1';let state=JSON.parse(localStorage.getItem(K)||'null')||{users:[],current:null,moves:[]};
const $=id=>document.getElementById(id);const money=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(n);
function persist(){localStorage.setItem(K,JSON.stringify(state))}
function showRegister(){$('loginBox').classList.add('hidden');$('regBox').classList.remove('hidden');$('msg').textContent=''}
function showLogin(){$('regBox').classList.add('hidden');$('loginBox').classList.remove('hidden');$('msg').textContent=''}
function register(){let u=$('ru').value.trim(),p=$('rp').value,c=$('rc').value;if(!u||!p)return msg('Preencha usuário e senha');if(p!==c)return msg('As senhas não conferem');if(state.users.some(x=>x.u===u))return msg('Usuário já existe');state.users.push({u,p});state.current=u;persist();openApp()}
function login(){let u=$('lu').value.trim(),p=$('lp').value;if(state.users.some(x=>x.u===u&&x.p===p)){state.current=u;persist();openApp()}else msg('Usuário ou senha inválidos')}
function msg(x){$('msg').textContent=x}
function logout(){state.current=null;persist();$('app').classList.add('hidden');$('auth').classList.remove('hidden')}
function openApp(){$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('user').textContent=state.current;render()}
function render(){let ms=state.moves.filter(m=>m.user===state.current),en=ms.filter(m=>m.type==='entrada').reduce((a,m)=>a+m.value,0),sa=ms.filter(m=>m.type==='saida').reduce((a,m)=>a+m.value,0),pe=ms.filter(m=>m.status==='pendente').reduce((a,m)=>a+m.value,0);$('ent').textContent=money(en);$('sai').textContent=money(sa);$('saldo').textContent=money(en-sa);$('pend').textContent=money(pe);$('rows').innerHTML=ms.slice().reverse().map(m=>`<tr><td>${m.date}</td><td>${m.type}</td><td>${m.cat}</td><td>${m.desc||'-'}${m.client?' · '+m.client:''}</td><td>${m.part}/${m.totalParts}</td><td>${money(m.value)}</td><td>${m.status}</td></tr>`).join('')||'<tr><td colspan="7" class="muted">Nenhuma movimentação.</td></tr>'}
function openModal(){$('modal').classList.remove('hidden');$('date').value=new Date().toISOString().slice(0,10)}
function closeModal(){$('modal').classList.add('hidden')}
function addMonths(date,n){let d=new Date(date+'T12:00:00');d.setMonth(d.getMonth()+n);return d.toISOString().slice(0,10)}
function saveMove(){let total=Number($('amount').value),parts=Math.max(1,Number($('parts').value)||1);if(!total||total<0)return alert('Informe o valor');let base=total/parts;for(let i=1;i<=parts;i++){state.moves.push({user:state.current,type:$('type').value,cat:$('cat').value,desc:$('desc').value,client:$('client').value,value:base,status:parts>1?'pendente':$('status').value,date:addMonths($('date').value,i-1),part:i,totalParts:parts})}persist();closeModal();render()}
function exportCSV(){let ms=state.moves.filter(m=>m.user===state.current);let csv='data,tipo,categoria,descricao,valor,status,parcela\n'+ms.map(m=>[m.date,m.type,m.cat,(m.desc||'').replaceAll(',',' '),m.value.toFixed(2),m.status,m.part+'/'+m.totalParts].join(',')).join('\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='nexus-finance.csv';a.click()}
if(state.current)openApp();
</script></body></html>
