<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Painel da Nexus Tecnologia" />
    <title>Nexus Tecnologia | Painel</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <style>
      .dashboard-page { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      .dashboard-card { width: min(760px, 100%); padding: 42px; border-radius: 24px; background: rgba(10, 18, 35, .88); border: 1px solid rgba(255,255,255,.12); box-shadow: 0 25px 80px rgba(0,0,0,.35); }
      .dashboard-card h1 { margin: 0 0 10px; color: #fff; }
      .dashboard-card > p { color: #b9c5d8; margin-bottom: 28px; }
      .dashboard-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-bottom: 30px; }
      .dashboard-button, .logout-button { border: 0; border-radius: 12px; padding: 13px 22px; cursor: pointer; font-weight: 700; color: #fff; text-decoration: none; }
      .dashboard-button { background: #0755ff; }
      .logout-button { background: rgba(255,255,255,.1); }
      .users-list { border-top: 1px solid rgba(255,255,255,.1); padding-top: 24px; }
      .users-list h2 { color: #fff; font-size: 18px; margin: 0 0 14px; }
      .user-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; margin-bottom: 8px; border-radius: 12px; background: rgba(255,255,255,.05); color: #dce6f5; }
      .delete-button { border: 0; border-radius: 9px; padding: 8px 12px; cursor: pointer; font-weight: 700; color: #fff; background: #b3263e; }
      .empty { color: #8f9caf; font-size: 14px; }
    </style>
  </head>
  <body class="login-page dashboard-page">
    <main class="dashboard-card">
      <p class="eyebrow">NEXUS TECNOLOGIA</p>
      <h1>Central de Gerenciamento</h1>
      <p>Login realizado com sucesso! Usuários cadastrados no sistema:</p>

      <div class="dashboard-actions">
        <a class="dashboard-button" href="/usuarios">+ Criar novo usuário</a>
        <form action="/logout" method="post">
          <button class="logout-button" type="submit">Sair do sistema</button>
        </form>
      </div>

      <section class="users-list">
        <h2>Usuários</h2>
        <div id="usersContainer"><p class="empty">Carregando...</p></div>
      </section>
    </main>

    <script>
      async function carregarUsuarios() {
        const container = document.getElementById('usersContainer');
        try {
          const response = await fetch('/api/usuarios');
          const data = await response.json();
          if (!data.success || !data.users.length) {
            container.innerHTML = '<p class="empty">Nenhum usuário cadastrado.</p>';
            return;
          }
          container.innerHTML = data.users.map(user => `
            <div class="user-row">
              <span>${escapeHtml(user.username)}</span>
              <form action="/usuarios/${user.id}/excluir" method="post" onsubmit="return confirm('Excluir este usuário?')">
                <button class="delete-button" type="submit">Excluir</button>
              </form>
            </div>
          `).join('');
        } catch (error) {
          container.innerHTML = '<p class="empty">Não foi possível carregar os usuários.</p>';
        }
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>'"]/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
      }

      carregarUsuarios();
    </script>
  </body>
</html>
