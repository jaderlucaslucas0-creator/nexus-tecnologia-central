<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nexus Tecnologia | Criar conta</title>
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card account-card">
      <div class="logo-wrap"><svg class="logo" viewBox="0 0 700 430" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b55ff"/><stop offset=".55" stop-color="#08dfff"/><stop offset="1" stop-color="#1450ff"/></linearGradient><linearGradient id="s" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".5" stop-color="#c8d0dc"/><stop offset="1" stop-color="#fff"/></linearGradient></defs><g transform="translate(350 150)"><circle r="120" fill="none" stroke="url(#s)" stroke-width="18" stroke-dasharray="480 95" transform="rotate(-35)"/><circle r="120" fill="none" stroke="url(#b)" stroke-width="9" stroke-dasharray="420 155" transform="rotate(-15)"/><path d="M-82-67 L-20-5 L-20 80 L-60 55 L-60-23 L-98-61 Z" fill="url(#b)"/><path d="M-80-70 L-35-70 L70 50 L32 50 Z" fill="url(#s)"/><path d="M55-52 L91-25 L91 55 L55 31 Z" fill="url(#b)"/><path d="M-42 80 L22 80 L-55-6 L-91-6 Z" fill="url(#b)"/></g><text x="350" y="310" text-anchor="middle" font-family="Arial" font-size="92" font-weight="800" letter-spacing="-6" fill="url(#s)">NE<tspan fill="url(#b)">X</tspan>US</text><text x="350" y="365" text-anchor="middle" font-family="Arial" font-size="25" letter-spacing="10" fill="#f2f4f8">TECNOLOGIA</text></svg></div>
      <div class="login-heading"><p class="eyebrow">NOVO ACESSO</p><h1>Criar uma conta</h1><p>Cadastre seu acesso à Nexus Tecnologia.</p></div>
      <form id="createAccountForm" class="login-form">
        <label for="name">Nome completo</label><div class="input-wrap"><input id="name" name="name" type="text" placeholder="Digite seu nome" required /></div>
        <label for="username">Usuário</label><div class="input-wrap"><input id="username" name="username" type="text" placeholder="Escolha um usuário" required /></div>
        <label for="password">Senha</label><div class="input-wrap"><input id="password" name="password" type="password" placeholder="Mínimo de 6 caracteres" minlength="6" required /></div>
        <button class="login-button" type="submit">Criar conta <span>→</span></button>
        <p id="accountMessage" class="login-message"></p>
      </form>
      <a class="create-account-button" href="/">← Voltar para o login</a>
      <footer>© 2026 Nexus Tecnologia · Acesso seguro</footer>
    </section>
  </main>
  <script>
    const form=document.getElementById('createAccountForm'),msg=document.getElementById('accountMessage');
    form.addEventListener('submit',async e=>{e.preventDefault();msg.textContent='Criando conta...';const r=await fetch('/usuarios/criar',{method:'POST',body:new FormData(form)});let d={};try{d=await r.json()}catch{}if(r.ok){msg.style.color='#67e0a3';msg.textContent='Conta criada com sucesso! Redirecionando...';setTimeout(()=>location.href='/',900)}else{msg.style.color='#ff8c8c';msg.textContent=d.message||'Não foi possível criar a conta.'}});
  </script>
</body>
</html>
