name: JARVIS Desktop
on:
  workflow_dispatch:
  push:
    paths:
      - "jarvis-desktop/**"
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: jarvis-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm install
      - name: Build frontend
        run: npm run build
      - name: Build Windows installer
        run: npx tauri build
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Windows
          path: jarvis-desktop/src-tauri/target/release/bundle/**/*
          if-no-files-found: error
