[package]
name="jarvis-ai"
version="1.0.2"
edition="2021"

[lib]
name="jarvis_ai_lib"
crate-type=["staticlib","cdylib","rlib"]

[dependencies]
tauri={version="2",features=[]}
tauri-plugin-shell="2"
serde={version="1",features=["derive"]}
serde_json="1"
reqwest={version="0.12",features=["json","rustls-tls"]}
urlencoding="2"
