<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus Tecnologia | Atendimento</title><style>body{margin:0;background:#040a17;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:32px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.card{background:#081325;border:1px solid #173452;border-radius:16px;padding:20px;margin-bottom:16px}.form{display:grid;grid-template-columns:2fr 1fr;gap:12px}input,textarea,select{box-sizing:border-box;width:100%;padding:12px;border-radius:10px;border:1px solid #21405f;background:#07101f;color:#fff}textarea{min-height:100px;resize:vertical}.full{grid-column:1/-1}button,.back{padding:11px 16px;border:0;border-radius:10px;background:#1468a8;color:#fff;font-weight:700;text-decoration:none;cursor:pointer}.ticket{border-top:1px solid #173452;padding:16px 0}.badge{font-size:11px;padding:5px 8px;border-radius:8px;background:#102e5b;color:#7ed8ff}.muted{color:#7f92aa;font-size:13px}.actions{display:flex;gap:8px;margin-top:10px}@media(max-width:650px){.wrap{padding:18px}.form{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="head"><div><h1>🎫 Atendimento</h1><p class="muted">Abra e acompanhe solicitações da Nexus Tecnologia.</p></div><a class="back" href="/dashboard">← Dashboard</a></div><section class="card"><h2>Novo atendimento</h2><form id="form" class="form"><input name="subject" placeholder="Assunto" maxlength="160" required><select name="priority"><option value="baixa">Baixa</option><option value="normal" selected>Normal</option><option value="alta">Alta</option><option value="urgente">Urgente</option></select><textarea class="full" name="description" placeholder="Descreva o problema ou solicitação..." maxlength="2000" required></textarea><div class="full"><button type="submit">Abrir atendimento</button></div></form><p id="msg" class="muted"></p></section><section class="card"><h2>Meus atendimentos</h2><div id="list"><p class="muted">Carregando...</p></div></section></main><script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(){const r=await fetch('/api/atendimento');const x=await r.json();document.getElementById('list').innerHTML=x.tickets.length?x.tickets.map(t=>`<div class="ticket"><b>#${t.id} — ${esc(t.subject)}</b> <span class="badge">${esc(t.status)}</span><p class="muted">Prioridade: ${esc(t.priority)} • ${esc(t.username)} • ${esc(t.created_at)}</p><p>${esc(t.description)}</p><div class="actions"><button onclick="status(${t.id},'em_atendimento')">Atender</button><button onclick="status(${t.id},'resolvido')">Resolver</button></div></div>`).join(''):'<p class="muted">Nenhum atendimento aberto.</p>'}async function status(id,s){const f=new FormData();f.append('status',s);await fetch('/api/atendimento/'+id+'/status',{method:'POST',body:f});load()}document.getElementById('form').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/atendimento',{method:'POST',body:new FormData(e.target)});const x=await r.json();document.getElementById('msg').textContent=x.message||'Atendimento criado.';if(r.ok){e.target.reset();load()}};load();</script></body></html>
