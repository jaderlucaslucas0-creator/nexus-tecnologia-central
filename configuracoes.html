<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus Tecnologia | Configurações</title><link rel="stylesheet" href="/src/styles.css"><style>body{margin:0;background:#040a17;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:32px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.card{background:#081325;border:1px solid #173452;border-radius:16px;padding:24px;margin-bottom:16px}.row{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;color:#9eafc5;font-size:13px;margin-bottom:7px}input,select{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #21405f;background:#07101f;color:#fff}button,.back{display:inline-block;padding:11px 16px;border:0;border-radius:10px;background:#1468a8;color:#fff;font-weight:700;text-decoration:none;cursor:pointer}.muted{color:#7f92aa;font-size:13px}@media(max-width:650px){.wrap{padding:18px}.row{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="head"><div><h1>⚙️ Configurações</h1><p class="muted">Controle básico da Central Nexus.</p></div><a class="back" href="/dashboard">← Dashboard</a></div><section class="card"><h2>🏢 Nexus Tecnologia</h2><p class="muted">Painel central de gerenciamento de sistemas.</p><div class="row"><div><label>Nome da empresa</label><input value="Nexus Tecnologia" readonly></div><div><label>Ambiente</label><input id="env" value="Verificando..." readonly></div></div></section><section class="card"><h2>🔐 Segurança</h2><p class="muted">As senhas são armazenadas com hash e as rotas administrativas exigem autenticação.</p><p id="health" class="muted">Verificando banco de dados...</p></section><section class="card"><h2>🎨 Preferências</h2><div><label>Modo da interface</label><select><option>Escuro — recomendado</option></select></div></section></main><script>fetch('/health').then(r=>r.json()).then(x=>{document.getElementById('env').value=x.persistent?'Produção — armazenamento persistente':'Ambiente local';document.getElementById('health').textContent=x.status==='ok'?`Banco OK • ${x.users} usuário(s) • ${x.systems} sistema(s) • Render ${x.render_configured?'configurado':'não configurado'}`:'Banco indisponível'}).catch(()=>document.getElementById('health').textContent='Não foi possível verificar o servidor.');</script></body></html>
