<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus Tecnologia | Relatórios</title><link rel="stylesheet" href="/src/styles.css"><style>body{margin:0;background:#040a17;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:32px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.card{background:#081325;border:1px solid #173452;border-radius:16px;padding:22px}.num{font-size:32px;font-weight:900;margin:12px 0}.muted{color:#7f92aa;font-size:13px}.back{display:inline-block;padding:11px 16px;border-radius:10px;background:#1468a8;color:#fff;text-decoration:none;font-weight:700}@media(max-width:700px){.wrap{padding:18px}.grid{grid-template-columns:1fr 1fr}}@media(max-width:450px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="head"><div><h1>📊 Relatórios</h1><p class="muted">Resumo atualizado da Central Nexus.</p></div><a class="back" href="/dashboard">← Dashboard</a></div><div class="grid"><div class="card">👥<div class="num" id="users">-</div><div class="muted">Usuários</div></div><div class="card">🖥️<div class="num" id="systems">-</div><div class="muted">Sistemas</div></div><div class="card">🟢<div class="num" id="active">-</div><div class="muted">Sistemas ativos</div></div><div class="card">🔴<div class="num" id="inactive">-</div><div class="muted">Sistemas desligados</div></div><div class="card">🎫<div class="num" id="tickets">-</div><div class="muted">Atendimentos</div></div><div class="card">⏳<div class="num" id="open">-</div><div class="muted">Atendimentos abertos</div></div></div></main><script>fetch('/api/relatorios').then(r=>r.json()).then(x=>{for(const [id,key] of [['users','users'],['systems','systems'],['active','active_systems'],['inactive','inactive_systems'],['tickets','tickets'],['open','open_tickets']])document.getElementById(id).textContent=x[key]??0}).catch(()=>document.querySelector('.wrap').insertAdjacentHTML('beforeend','<p class="muted">Não foi possível carregar os relatórios.</p>'));</script></body></html>
