<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus Tecnologia | Criar usuário</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <style>
      .users-page { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
      .users-card { width: min(500px, 100%); padding: 38px; border-radius: 24px; background: rgba(10, 18, 35, .92); border: 1px solid rgba(255,255,255,.12); box-shadow: 0 25px 80px rgba(0,0,0,.35); }
      .users-card h1 { margin: 0 0 8px; color: #fff; }
      .users-card > p { color: #b9c5d8; margin: 0 0 28px; }
      .user-form { display: grid; gap: 10px; }
      .user-form label { color: #dce6f5; font-weight: 600; margin-top: 8px; }
      .user-form input { width: 100%; box-sizing: border-box; padding: 14px 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); color: #fff; outline: none; }
      .user-form input:focus { border-color: #08dfff; }
      .create-button, .back-button { border: 0; border-radius: 12px; padding: 14px 18px; cursor: pointer; font-weight: 700; text-decoration: none; text-align: center; }
      .create-button { color: #fff; background: #0755ff; margin-top: 14px; }
      .back-button { color: #dce6f5; background: rgba(255,255,255,.08); margin-top: 4px; }
      .user-message { min-height: 22px; text-align: center; font-weight: 600; margin: 8px 0 0; }
    </style>
  </head>
  <body class="login-page users-page">
    <main class="users-card">
      <p class="eyebrow">CENTRAL DE GERENCIAMENTO</p>
      <h1>Criar novo usuário</h1>
      <p>Cadastre um usuário e uma senha para acessar o sistema.</p>

      <form id="userForm" class="user-form">
        <label for="username">Nome de usuário</label>
        <input id="username" name="username" type="text" minlength="3" placeholder="Digite o usuário" required />

        <label for="password">Senha</label>
        <input id="password" name="password" type="password" minlength="6" placeholder="Digite a senha" required />

        <label for="confirm_password">Confirmar senha</label>
        <input id="confirm_password" name="confirm_password" type="password" minlength="6" placeholder="Digite a senha novamente" required />

        <button class="create-button" type="submit">Criar usuário</button>
        <p id="userMessage" class="user-message" role="status"></p>
        <a class="back-button" href="/dashboard">← Voltar ao painel</a>
      </form>
    </main>

    <script>
      const form = document.getElementById('userForm');
      const message = document.getElementById('userMessage');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        message.textContent = 'Criando usuário...';

        try {
          const response = await fetch('/usuarios', {
            method: 'POST',
            body: new FormData(form)
          });
          const data = await response.json();
          message.textContent = data.message;
          message.style.color = data.success ? '#42e6a4' : '#ff6b7a';
          if (data.success) form.reset();
        } catch (error) {
          message.textContent = 'Não foi possível criar o usuário.';
          message.style.color = '#ff6b7a';
        }
      });
    </script>
  </body>
</html>
