services:
  - type: web
    name: nexus-finance
    runtime: python
    rootDir: finance
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nexus-finance-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: nexus-finance-db
    databaseName: nexus_finance
    user: nexus_finance
