<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>JARVIS | Nexus Tecnologia</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 10%,#102b52,#030711 55%);color:#eaf7ff;font-family:Arial,sans-serif;min-height:100vh}.wrap{max-width:1250px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #163957;padding-bottom:18px}.brand{font-size:25px;font-weight:900;letter-spacing:5px;color:#61d7ff}.sub{font-size:11px;color:#7892ab;letter-spacing:2px}.back{color:#76dfff;text-decoration:none}.grid{display:grid;grid-template-columns:1.4fr .8fr;gap:18px;margin-top:18px}.card{background:rgba(5,17,34,.88);border:1px solid #1a496d;border-radius:18px;padding:20px;box-shadow:0 0 30px rgba(25,150,255,.08)}h2{font-size:15px;margin:0 0 15px}.orb{height:210px;display:grid;place-items:center}.orb:before{content:"";width:145px;height:145px;border-radius:50%;border:2px solid #3ed5ff;box-shadow:0 0 25px #168dcc,0 0 70px rgba(41,194,255,.25),inset 0 0 35px rgba(41,194,255,.3);animation:pulse 2s infinite}.orb span{position:absolute;font-size:12px;letter-spacing:4px;color:#8de8ff}.cmd{display:flex;gap:8px}.cmd input,input,textarea,select{width:100%;background:#061225;border:1px solid #214764;color:white;border-radius:10px;padding:12px;outline:none}.btn{border:1px solid #2caee0;background:#092a44;color:#8eeaff;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.btn:hover{background:#104a70}.danger{border-color:#753b49;color:#ff9fac}.row{display:flex;gap:8px;margin:9px 0}.task{padding:12px;border:1px solid #173b59;border-radius:12px;background:#07182b;margin:8px 0}.task small{color:#6f8ba3}.badge{float:right;color:#6dffb4;font-size:10px}.memory{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #14314a;padding:9px 0}.status{color:#65e7ff;font-size:12px;min-height:20px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}.muted{color:#718aa0;font-size:12px}@keyframes pulse{50%{transform:scale(1.05);opacity:.7}}@media(max-width:850px){.grid{grid-template-columns:1fr}.cols{grid-template-columns:1fr}}
</style></head>
<body><div class="wrap">
<header class="top"><div><div class="brand">J.A.R.V.I.S</div><div class="sub">JUST A RATHER VERY INTELLIGENT SYSTEM</div></div><a class="back" href="/dashboard">← Nexus</a></header>
<div class="grid"><main>
<section class="card"><div class="orb"><span>JARVIS ONLINE</span></div><h2>🎙️ Comando de voz / texto</h2>
<div class="cmd"><input id="command" placeholder="Ex.: pesquise novidades de IA amanhã..."><button class="btn" onclick="send()">ENVIAR</button><button class="btn" onclick="listen()">🎙️</button></div><p id="reply" class="status">Pronto para receber comandos.</p></section>
<section class="card"><h2>🤖 Tarefas automáticas</h2><div class="cols"><input id="title" placeholder="Nome da tarefa"><select id="type"><option value="research">Pesquisa</option><option value="reminder">Lembrete</option><option value="activity">Atividade</option></select></div>
<div class="row"><input id="query" placeholder="Pesquisa / descrição"><input id="run_at" type="datetime-local"><input id="repeat" type="number" min="0" placeholder="Repetição (min)"></div><button class="btn" onclick="createTask()">+ Criar tarefa</button><div id="tasks" style="margin-top:12px"></div></section>
</main><aside>
<section class="card"><h2>🧠 Memória</h2><div class="row"><input id="mem" placeholder="Ex.: minha série é All Star"><button class="btn" onclick="saveMemory()">Salvar</button></div><div id="memory"></div></section>
<section class="card"><h2>📊 Computador</h2><div id="computer" class="muted">Carregando...</div></section>
<section class="card"><h2>🌐 Ações</h2><button class="btn" onclick="openSite()">🌐 Abrir site</button><button class="btn" onclick="say('Olá! Sou o JARVIS da Nexus Tecnologia.')">🗣️ Testar voz</button><p class="muted">Abertura de programas locais exige o aplicativo desktop. Sites podem ser abertos pelo navegador.</p></section>
</aside></div></div>
<script>
const $=id=>document.getElementById(id);
function say(t){if('speechSynthesis' in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';speechSynthesis.speak(u)}}
async function api(url,opt={}){let r=await fetch(url,{headers:{'Content-Type':'application/json'},...opt});return r.json()}
async function send(){let c=$('command').value.trim();if(!c)return;let r=await api('/api/jarvis/command',{method:'POST',body:JSON.stringify({command:c})});$('reply').textContent=r.reply||r.message;if(r.action==='open_url')window.open(r.url,'_blank','noopener');say(r.reply||r.message||'Comando processado');load()}
function listen(){if(!('webkitSpeechRecognition'in window||'SpeechRecognition'in window)){say('Reconhecimento de voz não está disponível neste navegador.');return}let R=window.SpeechRecognition||window.webkitSpeechRecognition;let x=new R();x.lang='pt-BR';x.onresult=e=>{$('command').value=e.results[0][0].transcript;send()};x.start();$('reply').textContent='Ouvindo...'}
async function createTask(){let r=await api('/api/jarvis/tasks',{method:'POST',body:JSON.stringify({title:$('title').value,task_type:$('type').value,query:$('query').value,description:$('query').value,run_at:$('run_at').value,repeat_minutes:$('repeat').value||0})});$('reply').textContent=r.message||'Tarefa criada.';['title','query','run_at','repeat'].forEach(x=>$(x).value='');load()}
async function load(){let [t,m,c]=await Promise.all([api('/api/jarvis/tasks'),api('/api/jarvis/memory'),api('/api/jarvis/computer')]);$('tasks').innerHTML=t.tasks.length?t.tasks.map(x=>`<div class="task"><span class="badge">${x.enabled?'ATIVA':'PAUSADA'}</span><b>${esc(x.title)}</b><br><small>${esc(x.task_type)} · ${esc(x.run_at||'sem horário')} · repete ${x.repeat_minutes||0} min</small><br><button class="btn" onclick="toggle(${x.id})">Pausar/Ativar</button> <button class="btn danger" onclick="delTask(${x.id})">Excluir</button></div>`).join(''):'<p class="muted">Nenhuma tarefa.</p>'; $('memory').innerHTML=m.memory.length?m.memory.map(x=>`<div class="memory"><span>${esc(x.content)}</span><button class="btn danger" onclick="delMem(${x.id})">×</button></div>`).join(''):'<p class="muted">Memória vazia.</p>'; $('computer').innerHTML=`Sistema: ${esc(c.sistema)}<br>Arquitetura: ${esc(c.arquitetura)}<br>Python: ${esc(c.python)}<br>Disco livre: ${esc(c.disco_livre_gb)} GB`}
async function toggle(id){await api('/api/jarvis/tasks/'+id+'/toggle',{method:'POST'});load()}async function delTask(id){await api('/api/jarvis/tasks/'+id+'/delete',{method:'POST'});load()}async function saveMemory(){let v=$('mem').value.trim();if(!v)return;await api('/api/jarvis/memory',{method:'POST',body:JSON.stringify({content:v})});$('mem').value='';load()}async function delMem(id){await api('/api/jarvis/memory/'+id,{method:'DELETE'});load()}
function openSite(){let u=prompt('Qual site deseja abrir?');if(u)window.open(u.startsWith('http')?u:'https://'+u,'_blank','noopener')}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}load();
</script></body></html>
