name: JARVIS Desktop - Windows

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop_app.py"
      - "desktop-requirements.txt"
      - "build-desktop.bat"
      - "app.py"
      - "*.html"
      - "src/**"
      - "jarvis/**"
      - ".github/workflows/build-desktop.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: python -m pip install -r desktop-requirements.txt

      - name: Gerar aplicativo
        run: python -m PyInstaller --noconfirm --clean --windowed --name JARVIS-Nexus --add-data "index.html;." --add-data "dashboard.html;." --add-data "jarvis.html;." --add-data "criar-conta.html;." --add-data "usuarios.html;." --add-data "sistemas.html;." --add-data "src;src" --add-data "jarvis;jarvis" desktop_app.py

      - name: Publicar aplicativo
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Nexus-Windows
          path: dist/JARVIS-Nexus/
          if-no-files-found: error
