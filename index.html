<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Nexus Tecnologia Central - acesso administrativo" />
  <title>Nexus Tecnologia | Login</title>
  <link rel="stylesheet" href="./src/styles.css" />
</head>
<body class="login-page">
  <div class="background-logo" aria-hidden="true">
    <svg viewBox="0 0 700 430" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bgBlue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0755ff"/><stop offset=".55" stop-color="#08ddff"/><stop offset="1" stop-color="#164eff"/></linearGradient>
        <linearGradient id="bgSilver" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".5" stop-color="#aeb8c8"/><stop offset="1" stop-color="#fff"/></linearGradient>
      </defs>
      <g transform="translate(350 150)"><circle r="120" fill="none" stroke="url(#bgSilver)" stroke-width="18" stroke-dasharray="480 95" transform="rotate(-35)"/><circle r="120" fill="none" stroke="url(#bgBlue)" stroke-width="9" stroke-dasharray="420 155" transform="rotate(-15)"/><path d="M-82-67 L-20-5 L-20 80 L-60 55 L-60-23 L-98-61 Z" fill="url(#bgBlue)"/><path d="M-80-70 L-35-70 L70 50 L32 50 Z" fill="url(#bgSilver)"/><path d="M55-52 L91-25 L91 55 L55 31 Z" fill="url(#bgBlue)"/><path d="M-42 80 L22 80 L-55-6 L-91-6 Z" fill="url(#bgBlue)"/></g>
      <text x="350" y="310" text-anchor="middle" font-family="Arial,Segoe UI,sans-serif" font-size="92" font-weight="800" letter-spacing="-6" fill="url(#bgSilver)">NE<tspan fill="url(#bgBlue)">X</tspan>US</text>
      <text x="350" y="365" text-anchor="middle" font-family="Arial,Segoe UI,sans-serif" font-size="25" font-weight="500" letter-spacing="10" fill="#f2f4f8">TECNOLOGIA</text>
    </svg>
  </div>

  <main class="login-shell">
    <section class="login-card">
      <div class="logo-wrap" aria-label="Nexus Tecnologia">
        <svg class="logo" viewBox="0 0 700 430" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0b55ff"/><stop offset=".55" stop-color="#08dfff"/><stop offset="1" stop-color="#1450ff"/></linearGradient>
            <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset=".5" stop-color="#c8d0dc"/><stop offset="1" stop-color="#fff"/></linearGradient>
            <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
          </defs>
          <g transform="translate(350 150)" filter="url(#glow)"><circle r="120" fill="none" stroke="url(#silver)" stroke-width="18" stroke-dasharray="480 95" transform="rotate(-35)"/><circle r="120" fill="none" stroke="url(#blue)" stroke-width="9" stroke-dasharray="420 155" transform="rotate(-15)"/><path d="M-82-67 L-20-5 L-20 80 L-60 55 L-60-23 L-98-61 Z" fill="url(#blue)"/><path d="M-80-70 L-35-70 L70 50 L32 50 Z" fill="url(#silver)"/><path d="M55-52 L91-25 L91 55 L55 31 Z" fill="url(#blue)"/><path d="M-42 80 L22 80 L-55-6 L-91-6 Z" fill="url(#blue)"/></g>
          <text x="350" y="310" text-anchor="middle" font-family="Arial,Segoe UI,sans-serif" font-size="92" font-weight="800" letter-spacing="-6" fill="url(#silver)">NE<tspan fill="url(#blue)">X</tspan>US</text>
          <text x="350" y="365" text-anchor="middle" font-family="Arial,Segoe UI,sans-serif" font-size="25" font-weight="500" letter-spacing="10" fill="#f2f4f8">TECNOLOGIA</text>
        </svg>
      </div>

      <div class="login-heading">
        <p class="eyebrow">CENTRAL DE GERENCIAMENTO</p>
        <h1>Bem-vindo</h1>
        <p>Acesse o painel da Nexus Tecnologia.</p>
      </div>

      <form id="loginForm" class="login-form">
        <label for="username">Usuário</label>
        <div class="input-wrap"><span class="input-icon">◉</span><input id="username" name="username" type="text" autocomplete="username" placeholder="Digite seu usuário" required /></div>
        <label for="password">Senha</label>
        <div class="input-wrap"><span class="input-icon">●</span><input id="password" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required /><button type="button" class="toggle-password" id="togglePassword">Mostrar</button></div>
        <button class="login-button" type="submit">Entrar no sistema <span>→</span></button>
        <p id="loginMessage" class="login-message" role="status"></p>
      </form>

      <a class="create-account-button" href="/criar-conta">Criar uma conta</a>
      <footer>© 2026 Nexus Tecnologia · Painel administrativo</footer>
    </section>
  </main>
  <script src="./src/app.js"></script>
</body>
</html>
