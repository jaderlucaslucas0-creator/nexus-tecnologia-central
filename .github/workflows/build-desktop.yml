name: JARVIS Desktop - Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop_app.py'
      - 'desktop_config.py'
      - 'desktop-requirements.txt'
      - 'core/**'
      - 'ai/**'
      - 'memory/**'
      - 'tools/**'
      - 'interface/**'
      - 'security/**'
      - 'plugins/**'
      - '.github/workflows/build-desktop.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r desktop-requirements.txt
      - name: Validate Python
        run: python -m compileall -q core ai memory tools interface security plugins desktop_config.py desktop_app.py
      - name: Test core
        run: python tests/test_jarvis_core.py
      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --windowed --name JARVIS-AI desktop_app.py
      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/JARVIS-AI/JARVIS-AI.exe')) { throw 'JARVIS-AI.exe não foi gerado.' }
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-AI-Windows
          path: dist/JARVIS-AI/
          if-no-files-found: error
          retention-days: 30