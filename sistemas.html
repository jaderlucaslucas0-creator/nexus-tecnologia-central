<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nexus Tecnologia | Sistemas</title><link rel="stylesheet" href="./src/styles.css"><style>
.page{min-height:100vh;padding:28px;color:#fff}.card{max-width:1050px;margin:auto;padding:28px;border:1px solid #193b5b;border-radius:22px;background:#071326;box-shadow:0 25px 70px #0008}.head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px}.head h1{margin:0 0 5px}.muted{color:#8092aa;font-size:12px}.back,.primary,.danger,.edit,.toggle{border:0;border-radius:10px;padding:10px 14px;color:#fff;text-decoration:none;font-weight:800;cursor:pointer}.back{background:#14253d}.primary{background:#1765ff}.toolbar{display:flex;gap:10px;margin-bottom:18px}.search{flex:1;padding:13px 15px;border-radius:11px;border:1px solid #294365;background:#050d1c;color:#fff;outline:0}.list{display:grid;gap:11px}.row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:17px;border:1px solid #172f4b;border-radius:14px;background:#0a182d}.info{display:flex;align-items:center;gap:13px}.icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:#123d70;font-size:20px}.name{font-weight:800}.url{display:block;color:#5ccfff;font-size:11px;margin-top:4px;max-width:480px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.open{color:#64d2ff;font-size:11px;text-decoration:none}.edit{background:#1b4770}.danger{background:#a92323}.toggle{min-width:92px}.toggle.on{background:#176f52}.toggle.off{background:#6b2932}.badge{font-size:10px;font-weight:900}.modal{display:none;position:fixed;inset:0;background:#000b;align-items:center;justify-content:center;padding:18px;z-index:5}.modal.show{display:flex}.box{width:min(450px,100%);padding:25px;border-radius:18px;background:#09172b;border:1px solid #285071}.box h2{margin-top:0}.form{display:grid;gap:11px}.form input,.form textarea{padding:12px;border-radius:9px;border:1px solid #294365;background:#050d1c;color:#fff}.form textarea{min-height:75px;resize:vertical}.form-actions{display:flex;gap:10px;margin-top:8px}.form-actions button{flex:1}.close{background:#1a2a41;color:#fff;border:0;border-radius:9px;padding:12px;font-weight:800;cursor:pointer}.empty{text-align:center;padding:35px}.status{font-size:10px;font-weight:900;margin-left:8px}.online{color:#67e0a3}.offline{color:#ff8c8c}@media(max-width:700px){.page{padding:15px}.card{padding:20px}.head{flex-direction:column;align-items:flex-start}.toolbar{flex-direction:column}.row{align-items:flex-start;flex-direction:column}.actions{width:100%;justify-content:flex-start}.url{max-width:80vw}}
</style></head><body class="login-page page"><main class="card"><header class="head"><div><h1>🖥️ Gerenciar sistemas</h1><span class="muted">Cadastre e controle os sites externos da Nexus Tecnologia.</span></div><a class="back" href="/dashboard">← Dashboard</a></header><div class="toolbar"><input id="search" class="search" placeholder="🔎 Pesquisar sistema..."><button class="primary" onclick="openCreate()">+ Novo sistema</button></div><div id="list" class="list"><div class="empty muted">Carregando sistemas...</div></div></main><div id="modal" class="modal"><div class="box"><h2 id="modalTitle">Novo sistema</h2><p class="muted">Informe o site que deseja gerenciar pelo Nexus.</p><form id="systemForm" class="form"><input id="name" name="name" placeholder="Nome do sistema" required><input id="url" name="url" type="url" placeholder="https://meusistema.com" required><textarea id="description" name="description" placeholder="Descrição"></textarea><div class="form-actions"><button type="button" class="close" onclick="closeModal()">Cancelar</button><button class="primary" type="submit">Salvar sistema</button></div></form></div></div><script>
let systems=[],editing=null;const list=document.getElementById('list'),modal=document.getElementById('modal'),form=document.getElementById('systemForm');
async function load(){const r=await fetch('/api/sistemas');if(!r.ok){list.innerHTML='<div class="empty muted">Não foi possível carregar os sistemas.</div>';return}systems=(await r.json()).systems;render()}
function render(){const q=document.getElementById('search').value.toLowerCase();const arr=systems.filter(s=>(s.name+' '+s.url+' '+(s.description||'')).toLowerCase().includes(q));if(!arr.length){list.innerHTML='<div class="empty muted">Nenhum sistema cadastrado.</div>';return}list.innerHTML=arr.map(s=>{const on=!!s.enabled;return `<div class="row"><div class="info"><div class="icon">🖥️</div><div><div class="name">${esc(s.name)} <span class="status ${on?'online':'offline'}">● ${on?'LIGADO':'DESLIGADO'}</span></div><span class="url">${esc(s.url)}</span><span class="muted">${esc(s.description||'Sem descrição')}</span></div></div><div class="actions"><a class="open" href="${escAttr(s.url)}" target="_blank" rel="noopener">Abrir ↗</a><button class="toggle ${on?'on':'off'}" onclick="toggleSystem(${s.id})">${on?'🟢 Ligar':'🔴 Desligar'}</button><button class="edit" onclick="editSystem(${s.id})">✏️ Editar</button><button class="danger" onclick="deleteSystem(${s.id},'${js(s.name)}')">🗑️ Excluir</button></div></div>`}).join('')}
function openCreate(){editing=null;document.getElementById('modalTitle').textContent='Novo sistema';form.reset();modal.classList.add('show')}function closeModal(){modal.classList.remove('show')}
function editSystem(id){const s=systems.find(x=>x.id===id);if(!s)return;editing=id;document.getElementById('modalTitle').textContent='Editar sistema';document.getElementById('name').value=s.name;document.getElementById('url').value=s.url;document.getElementById('description').value=s.description||'';modal.classList.add('show')}
form.addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(form);let url=editing?'/sistemas/'+editing+'/editar':'/sistemas/criar';const r=await fetch(url,{method:'POST',body:fd});if(r.ok){closeModal();await load()}else{const d=await r.json().catch(()=>({}));alert(d.message||'Não foi possível salvar.')}});
async function toggleSystem(id){const r=await fetch('/sistemas/'+id+'/toggle',{method:'POST'});if(r.ok)load();else alert('Não foi possível alterar o estado.')}
async function deleteSystem(id,name){if(!confirm(`Excluir o sistema “${name}”?\n\nEssa ação não pode ser desfeita.`))return;const r=await fetch('/sistemas/excluir/'+id,{method:'POST'});if(r.ok)load();else alert('Não foi possível excluir o sistema.')}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function escAttr(v){return esc(v).replace(/`/g,'&#096;')}function js(v){return String(v).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}document.getElementById('search').addEventListener('input',render);load();modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
</script></body></html>
